<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2 Lab 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
    <style>
        h1              {margin-bottom: 30px;}
        label           {font-weight: bold;}
        input, select   {margin-bottom: 10px;}
        form            {width: 30%; padding: 20px;}
    </style>
</head>
<body class="mt-2 ml-4">
    <h1>Employee Management System</h1>
    <form id="empForm">
    <form id="empForm" class="border p-4 bg-light" style="border:2px solid coral;">
        <div class="mb-3">
            <label for="id" class="form-label fw-bold">8-Digit Employee ID</label>
            <input id="id" type="text" class="form-control" maxlength="8" required />
        </div>

        <div class="mb-3">
            <label for="name" class="form-label fw-bold">Full Name</label>
            <input id="name" type="text" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="ext" class="form-label fw-bold">4-Digit Extension</label>
            <input id="ext" type="text" class="form-control" maxlength="4" required />
        </div>

        <div class="mb-3">
            <label for="email" class="form-label fw-bold">Email</label>
            <input id="email" type="email" class="form-control" required />
        </div>

        <div class="mb-4">
            <label for="department" class="form-label fw-bold">Department</label>
            <select id="department" class="form-select" required>
            <option value="Administrative">Administrative</option>
            <option value="Engineering">Engineering</option>
            <option value="Executive">Executive</option>
            <option value="Marketing">Marketing</option>
            <option value="Quality Assurance">Quality Assurance</option>
            <option value="Sales">Sales</option>
            </select>
        </div>

        <button id="submit" type="submit" class="btn btn-primary">Add Employee</button>
    </form>

    </form>
</body>
</html>
